name: Android TV Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
  push:
    tags:
      - 'android-tv-v*'

permissions:
  contents: write

concurrency:
  group: android-tv-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != android-tv-v* ]]; then
            echo "Android TV releases must run from an android-tv-v* tag."
            exit 1
          fi

      - name: Verify release state
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/kino/release-version.mjs verify --tag="$RELEASE_TAG"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KINO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KINO_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kino-release.keystore"

      - name: Configure runtime and signing properties
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.KINO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.KINO_SUPABASE_ANON_KEY }}
          INTRODB_API_URL: ${{ secrets.KINO_INTRODB_API_URL }}
          STORE_PASSWORD: ${{ secrets.KINO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KINO_RELEASE_KEY_PASSWORD }}
        run: |
          for name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured."
              exit 1
            fi
          done
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY
          INTRODB_API_URL=$INTRODB_API_URL
          DOVI_NATIVE_ENABLED=true
          DOVI_EXTRACTOR_HOOK_READY=true
          DOVI_ENABLE_REAL_LINK=true
          DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
          NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/kino-release.keystore
          NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD
          NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS
          NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Test updater and build full release APKs
        run: ./gradlew --no-daemon :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullRelease

      - name: Prepare release assets
        id: release-assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#android-tv-v}"
          apk_path="$(find app/build/outputs/apk/full/release -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "No universal Android TV release APK was produced."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk_path"
          mkdir -p release-assets
          asset_path="release-assets/Kino-TV-${version}.apk"
          cp "$apk_path" "$asset_path"
          version_code="$(awk -F= '$1 == "versionCode" {gsub(/\r/, "", $2); print $2}' release/versions/android-tv.properties)"
          node scripts/kino/release-manifest.mjs \
            --version="$version" \
            --version-code="$version_code" \
            --asset="$asset_path" \
            --output=release-assets/release-manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          name: Kino TV v${{ steps.release-assets.outputs.version }}
          generate_release_notes: true
